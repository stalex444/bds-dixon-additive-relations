      status: "proved"
      note: "(6). Under the hypotheses of (5): for c : f.rootSet f.SplittingField -> K, there is k : K with sum_r c r . (r : f.SplittingField) = algebraMap K f.SplittingField k if and only if there is t : K with c = fun _ => t. This is U = K.e. Proved by BDS.roots_inhomogeneous_iff_const: the forward direction is BDS.roots_inhomogeneous_const (each Galois translate of c has the same value and the same coefficient sum, so the difference is a zero-sum relation, 0 by (2); a Galois-invariant tuple on a transitive root set is constant), and the reverse direction is BDS.exists_sum_rootSet_eq_algebraMap (for any separable f over any field K, the sum of the roots is fixed by every automorphism of the splitting field, which is Galois over K, so it lies in K), with separability from Irreducible.separable."

