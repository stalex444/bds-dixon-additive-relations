version: "v0.4"
# Review status: self-assessed by the author (see the review block below).
# In this file, Greek letters, the membership sign, subscripts and superscripts inside quotations
# are transliterated to ASCII (e.g. psi, epsilon_0, 1_H^G, "in" for the membership sign; overbars
# omitted); the wording is otherwise verbatim.

project:
  name: "The additive theorem for 2-transitive Galois groups (Girstmair; Dixon, Theorem 1') and its representation-theoretic engine"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of the homogeneous case and,
    at the roots, of the printed form (relations with value in K), with
    coefficients in any field K of characteristic 0, of the additive theorem
    for 2-transitive Galois groups (Girstmair, Manuscripta Math. 39 (1982)
    81-97, Proposition 4, Assertion 3, p. 86, for every field whose
    characteristic does not divide |G|; stated by J. D. Dixon, Acta Arith.
    82 (1997) 293-302, as Theorem 1', p. 301, with its proof omitted), of
    its representation-theoretic engine (classical: Huppert, Endliche
    Gruppen I, p. 597, Satz 20.2, as cited by Girstmair, Acta Arith. 89
    (1999) 53-96, p. 78; used by Dixon on p. 297, in the proof of Theorem
    1(ii), citing Curtis-Reiner Section 32B), and of two criterion forms
    over any field whose hypothesis is the irreducibility of the
    augmentation module instead of 2-transitivity (the 'if' direction of
    Girstmair 1982, Proposition 4, Assertion 2, in its module form). Eight
    compared theorems, in namespace DixonRelations, in this order. (1)
    zeroSum_irreducible, the engine: for a finite group G acting
    2-transitively on a finite set Omega with 2 <= |Omega| and a field K of
    characteristic 0, the augmentation (zero-sum) subspace V0 = {f : Omega
    -> K | sum_x f x = 0} of the permutation module Omega -> K is an
    irreducible K[G]-module; proved in the substantive form of simplicity,
    that a G-invariant subspace W <= V0 with W != bot equals V0. The
    G-action is the permutation representation (g . f) x = f (g^{-1} . x),
    and a subrepresentation is a Submodule together with an explicit
    invariance hypothesis. (2')
    additive_core_of_irreducible, the zero-sum criterion form: for any field
    K, any group G (finite or not) acting on a finite Omega, an injective
    family alpha : Omega -> L into a K-vector space L, K-linear maps phi g
    with phi g (alpha x) = alpha (g . x) (no homomorphism property assumed),
    and the hypothesis hirr (every nonzero G-invariant K-subspace of V0 is
    V0, word for word the conclusion of (1); it holds vacuously when V0 = 0,
    that is |Omega| <= 1), any c with sum_x c x = 0 and sum_x c x . alpha x
    = 0 is 0. (2) additive_core, the zero-sum form for an abstract family:
    the same conclusion for K of characteristic 0 and a finite group G
    acting 2-transitively on Omega with 2 <= |Omega|; it is (1) followed by
    (2'). (3) additive_roots_no_relation, the zero-sum form at the roots:
    for K of characteristic 0 and an irreducible f in K[X] of degree >= 2
    whose Galois group acts 2-transitively on the roots of f in the
    splitting field, any K-valued coefficient tuple c on the roots with
    sum_r c r = 0 and sum_r c r . r = 0 is 0; G = f.Gal, Omega = f.rootSet
    f.SplittingField (with Mathlib's instance Polynomial.Gal.galActionAux),
    the family is the inclusion of the root set, phi g is the field
    automorphism g read as a K-linear map (the compatibility holds by rfl),
    and 2 <= |Omega| follows from card_rootSet_eq_natDegree with
    separability from Irreducible.separable; f.SplittingField appears in the
    2-transitivity hypothesis and in the types of c and of the relation
    hypothesis. (3) is the zero-sum part (value 0, coefficient sum 0) of the
    homogeneous case of Dixon's Theorem 1' at the roots; the full
    homogeneous case at the roots is (5), and the inhomogeneous case is (6).
    (4') relModule_le_span_one_of_irreducible, the span-one criterion form:
    under the hypotheses of (2') and a transitive action, every coefficient
    tuple c with sum_x c x . alpha x = 0 is a scalar multiple of the
    all-ones tuple, i.e. relModule K alpha is contained in the line K . (fun
    _ => 1). This is the 'if' direction of Girstmair 1982, Proposition 4,
    Assertion 2 (p. 86: "If G is primitive on G/H, (G,H) admits only trivial
    relations over K iff the complementary module U(G/H) of K epsilon_0 is
    simple"), whose hypothesis is, like hirr, the simplicity of a module;
    Girstmair 1999 restates it in character form as Proposition 12 (p. 78),
    "essentially contained in Proposition 4 of [11]". (4') assumes
    transitivity in place of primitivity; for a transitive action, hirr
    already forces primitivity (elementary, not formalized: the zero-sum
    functions constant on the blocks of a nontrivial block system form a
    nonzero proper invariant subspace of V0), so the difference is one of
    form only. (4) relModule_le_span_one, the span-one form: the same
    conclusion under the hypotheses of (2); it is (1) followed by (4'). (5)
    relModule_roots_le_span_one, the span-one form at the roots: under the
    hypotheses of (3), relModule K of the root family (fun r => (r :
    f.SplittingField)) is contained in K . (fun _ => 1); it is (4) at the
    roots. (6) roots_inhomogeneous_iff_const, Dixon's printed form at the
    roots: under the hypotheses of (3), sum_r c r . r = algebraMap K
    f.SplittingField k for some k in K if and only if c is constant; in
    Dixon's notation this is U = K.e. Dixon's Theorem 1' is stated for any
    subfield K of C and for relations with value in K; compared statements
    (2), (3), (4) and (5) concern its homogeneous case (value 0) and (6) its
    printed form (value in K), for every field K of characteristic 0, and
    (2') and (4') take any field. Girstmair 1982 states the additive theorem
    for every field whose characteristic does not divide |G|, so
    characteristic 0 is a sub-case of his hypothesis; (2') and (4') take any
    field, but their content is carried by hirr, which this entry proves
    only in characteristic 0 and only for 2-transitive actions, as (1). An
    uncompared bridge, BDS.isAtom_zeroSumSubrep_iff, shows that hirr
    together with V0 != bot is atomicity of V0 in Mathlib's lattice of
    subrepresentations of the permutation representation on Omega -> K. (1)
    is proved by an elementary, character-free stabilizer-averaging
    argument; Dixon (p. 297) cites Curtis-Reiner Section 32B for the
    statement only; Curtis-Reiner was not consulted, and nothing is claimed
    about its proof. (2') applies hirr to relModule K alpha meet V0 and uses
    injectivity of alpha; (4') shows that a relation and each of its
    translates differ by a zero-sum relation, so the relation is
    G-invariant, hence constant by transitivity (no averaging); the forward
    direction of (6) argues in the same way at the roots for a relation with
    value in K, using (2), and its reverse direction uses that the sum of
    the roots of a separable polynomial is fixed by every automorphism of
    the splitting field, which is Galois over K, and so lies in K. This
    formalizes classical results; it is not new mathematics. Research
    context: additive and multiplicative relations among conjugate algebraic
    numbers are studied in Girstmair (1982, 1999), Smyth (1986),
    Drmota-Skalba (1991), Baron-Drmota-Skalba (1995), Dixon (1997) and Zheng
    (2021); in the sources read for this entry the doubly transitive
    additive case is derived from the criterion and character theory in one
    sentence (Girstmair 1982, p. 86), set aside because the doubly
    transitive pairs are classified (Girstmair 1999, p. 78), and stated with
    its proof omitted (Dixon 1997, p. 301); this entry gives a complete,
    character-free, machine-checked proof. The namespace BDS of the two
    entry definitions is the development's historical name (after
    Baron-Drmota-Skalba); no result of Baron-Drmota-Skalba is formalized.
    Formalization status (search of 2026-10-28 for the six statements (1),
    (2'), (2), (3), (4') and (4) as stated here, at the repository heads
    listed in README.md; a search result, not a guarantee): none of the six
    statements searched was found in any prover; (5) and (6), searched for
    on 2026-10-29 at the repository heads listed in README.md, were not
    found either. The fact behind the reverse direction of (6), that the sum
    of the roots lies in the base field, is in Mathlib at the pin in Vieta
    form (Polynomial.Splits.nextCoeff_eq_neg_sum_roots_mul_leadingCoeff),
    for the multiset of roots. The S_n case of (1) is formalized in
    augmentation form over every field in which |Omega| != 0 (every field
    when |Omega| = 2), in particular over Q, in TauCeti
    (TauCeti.isIrreducible_standardRepresentation, since 2026-08-05) and as
    Specht-module irreducibility over C in openai/math; the general
    2-transitive case of (1) is formalized in character form over C in
    AxiomMath/CFSG (CFSG.permutation_character_orbit_count, public since
    2026-10-27), the closest item found: CFSG also defines the same V0 over
    C under the same action (CFSG.Wreathed.CentralSL2.sumZeroSubrep) and
    computes its character, from which the C case of (1) in submodule form
    would follow in a few lines, but no theorem stating it was found. NOT
    formalized and NOT claimed: the MULTIPLICATIVE theorem (Dixon Theorem
    1(ii), and, per Zheng 2021, arXiv:1912.07202v1, p. 2,
    Baron-Drmota-Skalba 1995, Theorem 3), under which 2-transitivity does
    NOT force triviality: for a prime p and b in Q not a p-th power, X^p - b
    has Galois group AGL(1,p) over Q, acting sharply 2-transitively on the
    roots, and the ratios of its roots are p-th roots of unity, nontrivial
    multiplicative relations; Dixon's Theorem 1(ii) gives necessary
    conditions for that exception; none of that multiplicative content is
    proved or claimed here. The additive theorem carries no such exception,
    because the additive module cannot contain any e_gamma - e_delta (Dixon,
    p. 301). Also not formalized: the 2-transitivity of any particular
    Galois group (a hypothesis in (1), (2), (3), (4), (5) and (6)); any case
    of hirr other than the 2-transitive one, (1); the imprimitive case
    (Girstmair 1982, Proposition 4, Assertion 1; Girstmair 1999, Proposition
    12, first sentence) and the fact that hirr forces primitivity for a
    transitive action; the 'only if' direction of the criterion, the
    character form of its hypothesis, and the converse of Assertion 3 that
    Girstmair 1982 states for a splitting field; and the identification of
    Omega -> K with the scalar extension of Omega -> Q.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  arxiv: ["math.NT", "math.RT", "cs.LO"]
  msc2020: ["11R04", "11R32", "20B20", "20C15", "68V20"]

sources:
  - title: "Polynomials with nontrivial relations between their roots"
    authors:
      - "John D. Dixon"
    id: "https://doi.org/10.4064/aa-82-3-293-302"
    # Crossref-verified: Acta Arith. 82(3), 293-302, 1997. The publisher's (IMPAN) article page
    # offers it as "Free download under CC-BY license" (checked 2026-10-28). Read in full.
    type: "article"
    location: "Theorem 1' (p. 301); the engine is cited on p. 297 (proof of Theorem 1(ii)); Theorem 1 on p. 296"
    relationship: "formalizes"
    note: >-
      Acta Arithmetica 82 (1997), 293-302. Theorem 1' (p. 301): for K a
      subfield of C and f in K[X] irreducible with Galois group acting
      2-transitively on the roots, U = K.e, where U = {c in K^Omega :
      sum_alpha c_alpha alpha in K} (by Dixon's definition, p. 301, the
      roots satisfy no nontrivial K-linear relation when U = eKG = K.e). Dixon omits the proof ("The
      proofs are very similar and are omitted"). Compared statements (2),
      (3), (4) and (5) formalize its homogeneous case U_1 = {c : sum c_alpha
      alpha = 0} for every field K of characteristic 0 (so every subfield of
      C): (2) and (3) give the zero-sum part U_1 meet V_0 = 0, (4) gives U_1
      <= K.e for an abstract family, and (5) gives U_1 <= K.e at the roots.
      The affine part (sum c_alpha alpha in K, nonzero) is formalized at the
      roots, for every K of characteristic 0, as compared statement (6),
      which gives U = K.e: the inclusion U <= K.e, and the inclusion K.e <=
      U (Dixon, p. 301: "we always have e in U"), from the fact that the sum
      of the roots lies in K. Compared statement (1) is the engine Dixon
      uses on p. 297 ("the QG-module V0 defined above is irreducible;
      indeed, it is absolutely irreducible (see [1], Sect. 32B)"), over
      every field K of characteristic 0; over an algebraically closed K it
      is the absolute irreducibility, stated for K-subspaces of Omega -> K
      (the identification with the scalar extension of Omega -> Q is not
      formalized). The additive theorem predates Dixon: see Girstmair 1982.
      Dixon's MULTIPLICATIVE Theorem 1(ii) is NOT formalized.
    license: "CC-BY (per the publisher, IMPAN)"
    author_endorsement: "not-contacted"
  - title: "Linear dependence of zeros of polynomials and construction of primitive elements"
    authors:
      - "Kurt Girstmair"
    id: "https://doi.org/10.1007/BF01312446"
    # Crossref-verified: Manuscripta Math. 39(1), 81-97, 1982. Free scan: GDZ Goettingen, via
    # EuDML doc 154873; pp. 81, 83, 86 and 97 read from the page images (2026-10-28/29).
    type: "article"
    location: "Proposition 4, Assertions 2 ('if' direction) and 3, p. 86; Proposition 1, p. 83"
    relationship: "formalizes"
    note: >-
      Manuscripta Mathematica 39 (1982), 81-97. Proposition 4 (p. 86) is
      stated for finite groups G containing H and "K a field with char(K)
      prime to |G|". Assertion 1: "If G acts imprimitively on G/H, (G,H)
      admits non-trivial relations over K." Assertion 2: "If G is primitive
      on G/H, (G,H) admits only trivial relations over K iff the
      complementary module U(G/H) of K epsilon_0 is simple." Assertion 3:
      "If G is doubly transitive on G/H, (G,H) admits only trivial
      relations." Its proof: "The third assertion follows from 2. and
      character theory (see e.g. [2], p. 597)", [2] being Huppert's book.
      "Only trivial relations" means that 0 and K epsilon_0 (the multiples
      of the all-ones tuple) are the only submodules of K(G/H) "belonging to
      H"; Proposition 1 (p. 83) identifies these submodules with the
      relation modules of a root. Compared statement (4') formalizes the
      'if' direction of Assertion 2 in its module form (hirr, like
      Girstmair's hypothesis, is the simplicity of a module), with
      transitivity in place of primitivity (under hirr a transitive action
      is primitive; elementary, not formalized), over any field and for any
      group, and with an injective family and compatible linear maps in
      place of the conjugates of a root; (2') formalizes its part on
      zero-sum relations, without transitivity. Compared statements (2),
      (3), (4) and (5) formalize the characteristic-0 case of Assertion 3,
      (2) and (3) in zero-sum form, (3) and (5) at the roots. Characteristic
      0 is a sub-case of Girstmair's hypothesis that char(K) does not divide
      |G|; (2') and (4') take any field, but their content is carried by
      hirr, which this entry proves only in characteristic 0 and only for
      2-transitive actions. Not formalized: Assertion 1, the 'only if'
      direction of Assertion 2, and the converse of Assertion 3 that
      Girstmair states for a splitting field. Read in part (pp. 81, 83, 86
      and 97).
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Linear relations between roots of polynomials"
    authors:
      - "Kurt Girstmair"
    id: "https://doi.org/10.4064/aa-89-1-53-96"
    # Crossref-verified: Acta Arith. 89(1), 53-96, 1999. The publisher's (IMPAN) article page
    # offers it as "Free download under CC-BY license" (checked 2026-10-28). Read in full.
    type: "article"
    location: "Proposition 12, p. 78, second sentence, 'if' direction (compared (2'), (4'), as the character-form restatement of Girstmair 1982, Proposition 4, Assertion 2), and the module-form sentence before it; the doubly transitive remark after it, p. 78 (compared (2), (3), (4), (5), characteristic 0); Definition 7, p. 78; the notion of a K-trivial pair, p. 55"
    relationship: "formalizes"
    note: >-
      Acta Arithmetica 89 (1999), 53-96. A pair (G,H) is K-trivial when the
      conjugates admit no additive relation except c(x1 + ... + xn) = 0 (p.
      55). Proposition 12 (p. 78), which Girstmair introduces as
      "essentially contained in Proposition 4 of [11]" ([11] = Girstmair
      1982), reads: "An imprimitive pair (G,H) is never K-trivial." and "A
      primitive pair (G,H) is K-trivial if, and only if, the character psi =
      1_H^G - 1 is K-irreducible". The paragraph leading to it states the
      criterion in module form: "Then the pair (G, H) is K-trivial if, and
      only if, U (G) is simple as a K[G]-module" (p. 78; U(G) is the
      zero-sum submodule of K[G/H]; char(K) = 0 is assumed from p. 62 on).
      Compared statements (2') and (4') formalize the 'if' direction of the
      second sentence in the module form of Girstmair 1982 (the hypothesis
      hirr for K-subspaces of Omega -> K rather than the K-irreducibility of
      psi; the equivalence of the two formulations is not formalized), with
      transitivity in place of primitivity (under hirr a transitive action
      is primitive; elementary, not formalized). On p. 78: the permutation
      character minus 1 is absolutely irreducible iff the action is doubly
      transitive (citing Huppert, Endliche Gruppen I, p. 597, Satz 20.2), so
      a doubly transitive pair is K-trivial for every K of characteristic 0;
      this "was observed in [11] (for the additive case, to be precise) and
      by later authors" (Girstmair 1982; Baron-Drmota-Skalba 1995, Theorem
      3, not opened, multiplicative per Zheng 2021, arXiv:1912.07202v1, p.
      2; Dixon 1997, Theorem 1, which is multiplicative by its statement, p.
      296). Compared statements (2), (3), (4) and (5) are the homogeneous
      case of this for 2-transitive actions, over every K of characteristic
      0, (2) and (3) in zero-sum form, (3) and (5) at the roots. Also on p.
      78: "Since there exists a complete classification of all doubly
      transitive pairs (cf., e.g., [3]), they are not of interest here." His
      Propositions 13-14 give Q-trivial pairs that are not doubly transitive
      (Proposition 13: the Q-trivial pairs among the transitive subgroups of
      AGL(1,q), not doubly transitive when the index d > 1; Proposition 14:
      certain PSL(2,q)); (2') and (4') apply to such a pair over Q once hirr
      is supplied over Q (no such case is proved here). On p. 53: "some
      minor observations of [11] appear as main results in later articles
      (cf., e.g., [11], Proposition 4, Assertion 3 and [9], Theorem 3)", [9]
      being Drmota-Skalba 1991. The remark after Definition 3 (p. 62)
      reduces relations with right side in K to homogeneous ones by
      averaging when char(K) does not divide |G|; the reduction step of the
      forward direction of compared statement (6)
      (BDS.roots_inhomogeneous_const) uses no averaging (it compares each
      Galois translate with the original; characteristic 0 enters only
      through (2) and the separability of f).
    license: "CC-BY (per the publisher, IMPAN)"
    author_endorsement: "not-contacted"
  - title: "Endliche Gruppen I"
    authors:
      - "Bertram Huppert"
    id: "https://doi.org/10.1007/978-3-642-64981-3"
    # Crossref-verified: Springer, Grundlehren der mathematischen Wissenschaften, 1967.
    type: "book"
    location: "p. 597, Satz 20.2 (as cited by Girstmair 1999, p. 78; Girstmair 1982, p. 86, cites p. 597)"
    relationship: "background"
    note: >-
      Springer, Berlin, 1967 (Grundlehren der mathematischen
      Wissenschaften). Cited by Girstmair 1999 (p. 78) for the classical
      engine: the permutation character minus 1 is absolutely irreducible iff
      the action is doubly transitive. Compared statement (1) is the 'if'
      direction, over every field of characteristic 0, in submodule form (at
      an algebraically closed field, absolute irreducibility stated for
      subspaces). Named in the alignment of (1) only as the reference that
      Girstmair cites; not opened, so listed as background.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Representation Theory of Finite Groups and Associative Algebras"
    authors:
      - "Charles W. Curtis"
      - "Irving Reiner"
    id: "Curtis, Reiner, Representation Theory of Finite Groups and Associative Algebras, Interscience/Wiley, New York, 1962 (Pure and Applied Mathematics XI)"
    # Textbook, no DOI. Cited by Dixon (p. 297); not opened for this entry.
    type: "book"
    location: "Section 32B (as cited by Dixon 1997, p. 297)"
    relationship: "background"
    note: >-
      Cited by Dixon (p. 297) for the irreducibility, indeed absolute
      irreducibility, of the QG-module V0 for 2-transitive G. Compared
      statement (1) proves the irreducibility over every field of
      characteristic 0 in the substantive form of simplicity, by an
      elementary character-free argument; nothing is claimed about the book's
      own proof. Named in the alignment of (1) only as the reference that
      Dixon cites; not opened, so listed as background.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "On multiplicative and linear independence of polynomial roots"
    authors:
      - "Michael Drmota"
      - "Mariusz Skalba"
    id: "Drmota, Skalba, Contributions to General Algebra 7 (1991), 127-135"
    # No DOI found. Bibliographic data as given in the reference list of Girstmair 1999 ([9]).
    # Not opened.
    type: "article"
    location: "Theorem 3 (as cited by Girstmair 1999, p. 53)"
    relationship: "background"
    note: >-
      Contributions to General Algebra 7 (1991), 127-135. Girstmair 1999
      (p. 53) writes that "some minor observations of [11] appear as main
      results in later articles (cf., e.g., [11], Proposition 4, Assertion 3
      and [9], Theorem 3)", [11] being Girstmair 1982 and [9] this paper.
      Background; its content is known here only through that sentence. Not
      opened.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Polynomial relations between polynomial roots"
    authors:
      - "Gerd Baron"
      - "Michael Drmota"
      - "Mariusz Skalba"
    id: "https://doi.org/10.1006/jabr.1995.1330"
    # Crossref-verified: J. Algebra 177(3), 827-846, 1995. Elsevier open archive (free to read;
    # Crossref license metadata); not opened. The exact form of its Theorem 3 is UNVERIFIED
    # against the primary.
    type: "article"
    location: "Theorem 3 (per Zheng 2021, arXiv:1912.07202v1, pp. 1-2)"
    relationship: "other"
    note: >-
      Journal of Algebra 177 (1995), 827-846. Cited for the MULTIPLICATIVE
      side: Zheng 2021 (arXiv:1912.07202v1, pp. 1-2), supposing f in Q[x]
      irreducible "with no root being a root of rational" (which excludes
      X^p - b), writes "by either [1, Theorem 3] or [4, Theorem 1], R_f is
      trivial if G_f is 2-transitive on the set of the roots of f", [1] being
      this paper, [4] Dixon 1997 and R_f the lattice of multiplicative
      relations; Girstmair 1999 (p. 78)
      lists Theorem 3 among the later observations. The multiplicative
      theorem is NOT formalized here and NOT claimed; 2-transitivity does not
      by itself force triviality in the multiplicative case (the X^p - b with
      Galois group AGL(1,p) are the exception; Dixon's Theorem 1(ii) gives
      necessary conditions for it). This entry formalizes only the ADDITIVE
      theorem. Not opened.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Additive and multiplicative relations connecting conjugate algebraic numbers"
    authors:
      - "Chris J. Smyth"
    id: "https://doi.org/10.1016/0022-314X(86)90094-6"
    # Crossref-verified: J. Number Theory 23(2), 243-254, 1986. Elsevier open archive (free to
    # read; Crossref license metadata); not opened.
    type: "article"
    location: "Lemma 1 (as described by Dixon 1997, p. 293)"
    relationship: "background"
    note: >-
      Journal of Number Theory 23 (1986), 243-254. Dixon (p. 293) describes
      its Lemma 1 as showing "that the existence of a nontrivial relation
      between the roots implies that G does not act as the symmetric group on
      Omega (see Theorem 1 below for a significant generalization)".
      Background to the theorem formalized here. Not opened.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A fast algorithm for computing multiplicative relations between the roots of a generic polynomial"
    authors:
      - "Tao Zheng"
    id: "https://doi.org/10.1016/j.jsc.2020.08.001"
    # Crossref-verified: J. Symbolic Comput. 104 (2021), 381-401. Preprint arXiv:1912.07202
    # (2019-12-16), "Computing Multiplicative Relations between Roots of a Polynomial".
    type: "article"
    location: "the sufficient condition for triviality and the lattice-basis algorithm; pp. 1-2 of arXiv:1912.07202v1"
    relationship: "background"
    note: >-
      Journal of Symbolic Computation 104 (2021), 381-401; preprint
      arXiv:1912.07202 ("Computing Multiplicative Relations between Roots of a
      Polynomial"). A sufficient-condition-and-algorithm paper on the
      MULTIPLICATIVE relation lattice of polynomial roots (a sufficient
      condition for triviality and an algorithm computing a lattice basis).
      Background on the multiplicative side, which is NOT formalized here; its
      pp. 1-2 (under the standing hypothesis that no root of f is a root of a
      rational) are the basis for describing Baron-Drmota-Skalba 1995,
      Theorem 3, as multiplicative.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4 (commit 065356127b1dc0016f66b7283ce0ce2c4055aa55)"
    relationship: "builds-on"
    note: >-
      The compared statements use Mathlib's
      MulAction.IsMultiplyPretransitive (the 2-transitivity hypothesis, with
      is_two_pretransitive_iff and isPretransitive_of_is_two_pretransitive),
      MulAction.IsPretransitive (the transitivity hypothesis of (4')),
      CharZero (with Nat.cast_ne_zero), Polynomial.Gal and its action
      Polynomial.Gal.galActionAux on Polynomial.rootSet of
      Polynomial.SplittingField, the algebra map algebraMap (the value k in
      K of (6)), Polynomial.card_rootSet_eq_natDegree (the root count),
      Irreducible.separable (separability over a characteristic-zero field),
      IsGalois.of_separable_splitting_field and
      IsGalois.mem_range_algebraMap_iff_fixed (in the proof of the reverse
      direction of (6)), and the Submodule span/lattice API
      (Submodule.mem_span_singleton, Submodule.ne_bot_iff,
      Submodule.mem_inf, Submodule.mem_bot). The permutation representation
      Representation.ofMulAction (on MonoidAlgebra, with action formula
      Representation.coeff_ofMulAction) is the modeling anchor for the
      action on Omega -> K; the uncompared bridge uses LinearMap.funLeft,
      Subrepresentation and its lattice, and IsAtom. These are quoted
      verbatim, with path, line range and permalink at the pin, in
      MATHLIB_DEFINITIONS.md, with kernel-checked facts in
      DefinitionAudit.lean. Nothing representation-theoretic about
      2-transitive permutation modules is consumed from Mathlib: the engine
      (1) is proved from scratch by an elementary, character-free
      stabilizer-averaging argument.
  - id: "https://github.com/TauCetiProject/TauCeti (commit e6b5f42c62ab0484faf5c0e66079de65bcc138a2)"
    relationship: "independent"
    note: >-
      Apache-2.0. TauCeti.isAtom_augmentationSubrepresentation and
      TauCeti.isIrreducible_standardRepresentation
      (TauCeti/RepresentationTheory/Symmetric/Standard.lean, since PR #2030,
      2026-08-05): for S_n acting on alpha over any division ring (resp.
      field), with 2 <= |alpha| and (|alpha| = 2 or |alpha| != 0), the
      augmentation subrepresentation of Representation.ofMulAction is an atom
      (resp. the standard representation is irreducible). This is the S_n
      instance of compared statement (1), in augmentation form, over Q among
      other fields, with an elementary character-free proof via
      transpositions. Separately,
      TauCeti.is_two_pretransitive_iff_irreducible_divByMonic
      (TauCeti/FieldTheory/GaloisGroups/MultipleTransitivity.lean) uses the
      same encoding of 2-transitivity of a Galois root action as compared
      statement (3), IsMultiplyPretransitive p.Gal (p.rootSet
      p.SplittingField) 2; and TauCeti.isBaseChange_augmentationScalarMap
      (TauCeti/RepresentationTheory/Augmentation/BaseChange.lean) proves the
      base-change property of the augmentation module in Mathlib's
      MonoidAlgebra encoding, which bears on the scalar-extension
      identification this entry does not formalize. Not imported.
  - id: "https://github.com/AxiomMath/CFSG (commit 69cb972f587a3ecc035e092253167ff2e303c962)"
    relationship: "independent"
    note: >-
      Apache-2.0; public since 2026-10-27. CFSG.permutation_character_orbit_count
      (CFSG/CharacterTheory/PermutationCharacterOrbits.lean): for finite W
      acting transitively on a finite I with 2 <= |I|, IsMultiplyPretransitive
      W I 2 holds iff the permutation character minus 1 is the character of an
      irreducible complex representation (BlocksIrr W). The general
      2-transitive engine in character form over C, with its converse. Not
      the submodule form of compared statement (1). CFSG also defines
      CFSG.Wreathed.CentralSL2.sumZeroSubmodule and sumZeroSubrep
      (CFSG/CharacterTheory/Wreathed/CentralSL2/SumZero.lean), the zero-sum
      subspace of I -> C under f |-> f (w^{-1} . i), that is V0 over C with
      the action used here, with sumZeroSubrep_character (character = fixed
      points - 1); combined with permutation_character_orbit_count this would
      give the C case of (1) in submodule form in a few lines, but no theorem
      stating that was found. Also
      CFSG.Semidihedral.Principal.doubly_transitive_prime_divisible_degree_principal_augmentation
      (CFSG/CharacterTheory/Semidihedral/Principal/DoublyTransitiveAugmentation.lean):
      for a 2-transitive action with p dividing |Omega|, an irreducible
      complex representation with character fixed points - 1 in the principal
      p-block (character form over C, under a divisibility hypothesis). Not
      imported.
  - id: "https://github.com/openai/math (commit 7ef5c0cc5ca4b0e072b7a050fca09ab24bc6fa3a)"
    relationship: "independent"
    note: >-
      Apache-2.0. Proves, over C, that every Specht module of the symmetric
      group S_n is irreducible, in several developments, among them
      OAI.Saxl.specht_irreducible
      (lean/OAI/RepresentationTheory/Saxl/SpechtSubmodule.lean), the instance
      OAI.PartialPermutation.YoungTabloid.specht_irreducible
      (lean/OAI/RepresentationTheory/PartialPermutation/SpechtModules.lean),
      and OAI.CubeShuffle.Specht.representation_irreducible
      (lean/OAI/RepresentationTheory/YoungSymmetry/Polytabloid.lean, with
      labelledRepresentation_irreducible in
      lean/OAI/RepresentationTheory/YoungSymmetry/Irreducible.lean). For the
      shape (n-1, 1) the Specht module is the augmentation summand of the
      natural S_n permutation module, so the S_n instance of compared
      statement (1) follows over C. Stated for Specht modules of S_n, not for
      2-transitive groups. Not imported; (2'), (2), (3), (4') and (4) are
      absent there.

status:
  scope: >-
    Formalized, 8 compared theorems, hypotheses inline, in namespace
    DixonRelations: zeroSum_irreducible (1), additive_core_of_irreducible
    (2'), additive_core (2), additive_roots_no_relation (3),
    relModule_le_span_one_of_irreducible (4'), relModule_le_span_one (4),
    relModule_roots_le_span_one (5) and roots_inhomogeneous_iff_const (6).
    Each compared theorem is one declaration; Solution.lean proves each by
    one application of the theorem of the same name in namespace BDS. The
    proof library is BDS.lean + BDS/Defs.lean,
    BDS/TwoTransitiveIrreducible.lean, BDS/AdditiveRelations.lean: the
    author's earlier kernel-checked development over Q, split into a library
    layout with module-system headers and, on 2026-10-28 at the author's
    direction, generalized to a field K and extended by the criterion forms
    (2') and (4'), with (2) and (4) re-proved as (1) followed by (2') and
    (4'). The library also holds BDS/RootsCorollaries.lean, the proofs of
    (5) and (6) at the roots (BDS.relModule_roots_le_span_one and
    BDS.roots_inhomogeneous_iff_const, the latter combining
    BDS.roots_inhomogeneous_const with BDS.exists_sum_rootSet_eq_algebraMap,
    the sum of the roots of a separable polynomial lies in the base field),
    and BDS/AtomBridge.lean, an uncompared bridge from the hypothesis hirr
    to Mathlib's lattice of subrepresentations
    (BDS.isAtom_zeroSumSubrep_iff, BDS.isAtom_zeroSumSubrep). WHAT IS
    FORMALIZED: the additive theorem for 2-transitive Galois groups
    (Girstmair 1982, Proposition 4, Assertion 3; Dixon Theorem 1') in its
    homogeneous case (relations sum c_alpha alpha = 0) with coefficients in
    any field K of characteristic 0, in zero-sum abstract (2), zero-sum
    roots (3), span-one abstract (4) and span-one roots (5) forms, and in
    Dixon's printed form at the roots (6), U = K.e for relations with value
    in K, for every K of characteristic 0; its engine (1), the
    irreducibility over K of the augmentation module of a 2-transitive
    action, in the substantive form of simplicity (over an algebraically
    closed K, absolute irreducibility stated for K-subspaces); the criterion
    forms (2') and (4') over any field (the 'if' direction of Girstmair
    1982, Proposition 4, Assertion 2, in its module form, restated in
    character form as Girstmair 1999, Proposition 12; with transitivity,
    which under hirr forces primitivity). WHAT IS NOT FORMALIZED and NOT
    CLAIMED: the MULTIPLICATIVE theorem (Dixon Theorem 1(ii); per Zheng
    2021, Baron-Drmota-Skalba 1995, Theorem 3) and its AGL(1,p)/pure-power
    exception; the 2-transitivity of any particular Galois group (a
    hypothesis in (1), (2), (3), (4), (5) and (6), not a theorem here); any
    case of hirr other than the 2-transitive one, (1); the imprimitive case
    and the fact that hirr forces primitivity for a transitive action; the
    'only if' direction of the criterion, the character form of its
    hypothesis, and the converse of Assertion 3 for a splitting field; and
    the identification of Omega -> K with the scalar extension of Omega ->
    Q.
  # Per the v0.4 schema, sorry_count excludes the deliberate placeholders in the Comparator
  # challenge module (Challenge.lean carries exactly 8, one per compared statement).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  # Every compared theorem's #print axioms output is exactly
  # [propext, Classical.choice, Quot.sound], and so is each BDS proof
