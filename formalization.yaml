fidelity:
  divergences: >-
    (i) The permutation module K[Omega], for a field K, is modeled as the
    space of functions Omega -> K. Mathlib's Representation.ofMulAction K G
    Omega acts on K[Omega] = MonoidAlgebra K Omega (a one-field structure),
    which is related to Omega ->0 K by MonoidAlgebra.coeffLinearEquiv and,
    Omega being finite, to Omega -> K by Finsupp.equivFunOnFinite; its
    action formula is Representation.coeff_ofMulAction (restated as
    DefinitionAudit.coeff_ofMulAction). The G-action used here is the
    permutation representation (g . f) x = f (g^{-1} . x). (ii) A
    G-subrepresentation is modeled as a Submodule K (Omega -> K) W together
    with an explicit invariance hypothesis (for all g f, f in W -> (fun x =>
    f (g^{-1} . x)) in W); this needs no bundled Rep/asModule machinery. The
    invariance hypothesis is the defining condition of a subrepresentation
    of the permutation representation on Omega -> K (BDS.permRep, in the
    uncompared bridge); its transport to ofMulAction on K[Omega] is not
    formalized. (iii) The augmentation (zero-sum) submodule is zeroSum K
    Omega = {f : Omega -> K | sum_x f x = 0}; the module of linear relations
    of a family alpha in a K-vector space is relModule K alpha = {c : Omega
    -> K | sum_x c x . alpha x = 0} (K is an explicit argument, since alpha
    does not determine it). Both are entry definitions, stated in
    Challenge.lean between -- BEGIN SHARED DEFINITIONS and -- END SHARED
    DEFINITIONS, byte-identical to BDS/Defs.lean. (iv) The engine (1) is
    stated as the substantive half of simplicity of the K[G]-module V0, for
    every field K of characteristic 0 (not as Mathlib's
    Representation.IsIrreducible): every G-invariant W <= V0 with W != bot
    equals V0. Together with the elementary facts, not part of the
    statement, that V0 is G-invariant and nonzero when 2 <= |Omega| (both
    proved, uncompared, as BDS.zeroSum_invariant and within
    BDS.isAtom_zeroSumSubrep), this is simplicity. Dixon's stronger claim,
    absolute irreducibility, is (1) at an algebraically closed K of
    characteristic 0, stated for K-subspaces of Omega -> K; the
    identification of Omega -> K with the scalar extension of Omega -> Q is
    not formalized. The uncompared bridge BDS.isAtom_zeroSumSubrep_iff shows
    that the form of (1), together with V0 != bot, is atomicity of V0 in
    Mathlib's lattice of subrepresentations of the permutation
    representation on Omega -> K (defined there from LinearMap.funLeft; its
    transport to ofMulAction is not formalized). (v) Dixon's conclusion that
    the roots "cannot satisfy a nontrivial K-linear relation" (p. 301) is
    rendered, in its homogeneous case, as: any coefficient tuple with zero
    total weight and vanishing linear combination is identically 0
    (additive_core, additive_roots_no_relation: the zero-sum part), and
    relModule K alpha <= K . (fun _ => 1) (relModule_le_span_one; at the
    roots, relModule_roots_le_span_one), i.e. every vanishing relation is a
    scalar multiple of the all-ones tuple (which is itself a relation
    exactly when sum_x alpha x = 0). In its printed form (value in K), at
    the roots, it is rendered as: a coefficient tuple c satisfies sum_r c r
    . r = algebraMap K f.SplittingField k for some k in K if and only if c
    is constant (roots_inhomogeneous_iff_const). (vi) In the concrete
    statements (3), (5) and (6) the group is f.Gal, the set is f.rootSet
    f.SplittingField with Mathlib's instance Polynomial.Gal.galActionAux
    (DefinitionAudit.gal_instance_eq), the family alpha is the inclusion
    Subtype.val of the root set into the splitting field, and phi g is the
    Galois automorphism g read as a K-linear map (toLinearMap); the
    compatibility phi g (alpha x) = alpha (g . x) holds by rfl
    (DefinitionAudit.gal_smul_coe), and 2 <= |Omega| comes from
    card_rootSet_eq_natDegree with separability from Irreducible.separable
    (characteristic 0). (vii) 2-transitivity is the hypothesis
    MulAction.IsMultiplyPretransitive G Omega 2 (concretely
    IsMultiplyPretransitive f.Gal (f.rootSet f.SplittingField) 2); that a
    particular Galois group is 2-transitive is not proved here. (viii) The
    MULTIPLICATIVE theorem and its AGL(1,p)/pure-power exception are outside
    the formalized scope and are not claimed. (ix) Dixon's Theorem 1' allows
    any subfield K of C, and its relations are tuples with coefficients in K
    and value in K (sum c_alpha alpha in K; 'nontrivial' means U != eKG).
    Compared statements (2), (3), (4) and (5) take any field K of
    characteristic 0 (every subfield of C is one) and value 0 (Dixon's U_1),
    and (6) takes any field K of characteristic 0 and value in K (Dixon's
    U); (2') and (4') take any field. (3) is the zero-sum part (value 0 and
    coefficient sum 0, U_1 meet V_0 = 0) at the roots; the homogeneous case
    at the roots, U_1 <= K.e, is (5). Dixon's form at the roots, for every K
    of characteristic 0, is (6), which gives U = K.e: both U <= K.e and the
    inclusion K.e <= U (Dixon, p. 301: "we always have e in U"; the sum of
    the roots lies in K). Dixon's roots lie in C, with G = Gal(K(Omega)/K);
    here they lie in Mathlib's abstract f.SplittingField and no embedding
    into C is formalized. The hypothesis 2 <= f.natDegree of (3), (5) and
    (6) is not in Dixon's Theorem 1' (it excludes only deg f <= 1, where the
    root set has at most one element and where the conclusions of (3), (5)
    and (6) hold trivially, a zero-sum tuple on at most one point being 0,
    every tuple on at most one point being constant, and the root of a
    polynomial of degree 1 lying in K). (x) In (2), (2'), (4) and (4'), phi
    is any family of K-linear maps with phi g (alpha x) = alpha (g . x); no
    homomorphism property is assumed (a generalization of a linear
    realization of the action). (xi) Compared statement (4) is stated for an
    abstract family alpha; its instance at the roots of f is compared
    statement (5). (xii) The criterion forms (2') and (4') take as
    hypothesis hirr, whose text is word for word the conclusion of (1):
    every nonzero G-invariant K-subspace of V0 is V0 (vacuously true when V0
    = 0). They hold for any field K and any group G acting on a finite
    Omega, with no bound on |Omega|; (4') adds transitivity,
    MulAction.IsPretransitive G Omega, which cannot be dropped (for |Omega|
    = 2, the trivial group and alpha = (1, 2) in Q, hirr holds but (2, -1)
    is a relation; an example, not formalized). (4') is the 'if' direction
    of Girstmair 1982, Proposition 4, Assertion 2, whose hypothesis, like
    hirr, is the simplicity of a module; Girstmair 1999, Proposition 12,
    restates it with the K-irreducibility of the character 1_H^G - 1 (the
    equivalence of the two formulations is not formalized). Girstmair
    assumes primitivity, (4') transitivity; for a transitive action hirr
    already forces primitivity (elementary, not formalized), so the
    difference is one of form. Girstmair assumes a finite G and char(K) not
    dividing |G|; (2') and (4') take any field and any group, but their
    content is carried by hirr, which this entry proves only in the
    2-transitive case over a field of characteristic 0, (1).
