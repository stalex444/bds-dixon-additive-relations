  status: "self-assessed"
  reviewers:
    - "Stephanie Alexander"
  notes: >-
    Not peer-reviewed. The kernel, the axiom audit and the registry
    comparator (run locally with --inadvisably-no-sandbox) are the
    acceptance criteria. On 2026-10-28 the package went through in-house
    reviews, performed by AI agents (Anthropic Claude) under the author's
    direction, against the registry's criteria, statement fidelity and prior
    art; their findings were applied on 2026-10-28 and 2026-10-29, in text
    only, with no compared Lean statement changed. Separately, on
    2026-10-29, at the author's direction, compared statements (5) and (6)
    were added, with one new library lemma behind (6) (see automation); the
    six earlier compared statements are unchanged. The build carries
    pre-existing deprecation and style lints, listed in BUILD.txt, from
    proof text kept from the author's earlier development. Dixon 1997 and
    Girstmair 1999 were read in full; Girstmair 1982 was read in part (pp.
    81, 83, 86 and 97, on the free GDZ Goettingen scan). Every DOI and arXiv
    identifier was checked against Crossref or arXiv on 2026-10-28;
    Curtis-Reiner and Drmota-Skalba 1991 have neither. Huppert,
    Curtis-Reiner, Drmota-Skalba 1991, Baron-Drmota-Skalba and Smyth were
    not opened.

alignment:
  namespace: "DixonRelations"
  statements:
    - source: "Dixon 1997, p. 297 (proof of Theorem 1(ii)), citing Curtis-Reiner 1962, Sect. 32B: the QG-module V0 of a 2-transitive G is irreducible, indeed absolutely irreducible (classical; Huppert, Endliche Gruppen I, p. 597, Satz 20.2, as cited by Girstmair 1999, p. 78)"
      lean: "DixonRelations.zeroSum_irreducible"
      module: "Solution"
      status: "proved"
      note: "(1). For K a field of characteristic 0 and G finite acting 2-transitively on finite Omega with 2 <= |Omega|, a G-invariant W <= V0 = zeroSum K Omega with W != bot equals V0 (the substantive half of simplicity of the K[G]-module V0; at an algebraically closed K, absolute irreducibility stated for K-subspaces). Proved by BDS.zeroSum_irreducible."
    - source: "Girstmair 1982, Proposition 4, Assertion 2 (p. 86), 'if' direction, its part on zero-sum relations (relation modules read as submodules belonging to H, Proposition 1, p. 83); restated in character form as Girstmair 1999, Proposition 12 (p. 78). Here without transitivity, over any field and for any group"
      lean: "DixonRelations.additive_core_of_irreducible"
      module: "Solution"
      status: "proved"
      note: "(2'). For any field K, any group G acting on finite Omega, an injective alpha : Omega -> L, K-linear maps phi g with phi g (alpha x) = alpha (g . x), and hirr (every nonzero G-invariant K-subspace of V0 is V0, word for word the conclusion of (1)): any c with sum_x c x = 0 and sum_x c x . alpha x = 0 is 0. Proved by BDS.additive_core_of_irreducible (applies hirr to relModule K alpha meet V0, then injectivity)."
    - source: "Girstmair 1982, Proposition 4, Assertion 3 (p. 86), characteristic 0, and Dixon 1997, Theorem 1' (p. 301): homogeneous case, zero-sum part (U_1 meet V_0 = 0), for an abstract family"
      lean: "DixonRelations.additive_core"
      module: "Solution"
      status: "proved"
      note: "(2). For K of characteristic 0, an injective alpha : Omega -> L, a 2-transitive action of a finite G on finite Omega with 2 <= |Omega|, and K-linear maps phi g with phi g (alpha x) = alpha (g . x): any c with sum_x c x = 0 and sum_x c x . alpha x = 0 is 0. Proved by BDS.additive_core, which is (1) followed by (2')."
    - source: "Dixon 1997, Theorem 1' (p. 301): K of characteristic 0, homogeneous case, zero-sum part (U_1 meet V_0 = 0), roots in f.SplittingField (the zero-sum part of the characteristic-0 case of Girstmair 1982, Proposition 4, Assertion 3, p. 86, at the roots)"
      lean: "DixonRelations.additive_roots_no_relation"
      module: "Solution"
      status: "proved"
      note: "(3). For K of characteristic 0 and irreducible f in K[X] of degree >= 2 with f.Gal acting 2-transitively on f.rootSet f.SplittingField: any K-valued c on the root set with sum_r c r = 0 and sum_r c r . (r : SplittingField) = 0 is 0. Proved by BDS.additive_roots_no_relation (instantiates (2) at G = f.Gal). The full homogeneous case at the roots (U_1 <= K.e) is (5), and the inhomogeneous case (sum_r c r . r in K) is (6)."
    - source: "Girstmair 1982, Proposition 4, Assertion 2 (p. 86: 'If G is primitive on G/H, (G,H) admits only trivial relations over K iff the complementary module U(G/H) of K epsilon_0 is simple'), 'if' direction, module form; restated in character form as Girstmair 1999, Proposition 12 (p. 78). Here with transitivity, which under hirr forces primitivity (not formalized), over any field and for any group"
      lean: "DixonRelations.relModule_le_span_one_of_irreducible"
      module: "Solution"
      status: "proved"
      note: "(4'). Under the hypotheses of (2') and a transitive action (IsPretransitive G Omega), relModule K alpha <= K . (fun _ => 1). Any field K, any group G. Proved by BDS.relModule_le_span_one_of_irreducible (a relation and its translates differ by zero-sum relations, so it is G-invariant, hence constant)."
    - source: "Girstmair 1982, Proposition 4, Assertion 3 (p. 86), characteristic 0, and Girstmair 1999, p. 78 (a doubly transitive pair is K-trivial for every K of characteristic 0); Dixon 1997, Theorem 1' (p. 301), homogeneous case U_1 <= K.e, for an abstract family; Dixon's U = K.e (relations with value in K) is (6), at the roots"
      lean: "DixonRelations.relModule_le_span_one"
      module: "Solution"
